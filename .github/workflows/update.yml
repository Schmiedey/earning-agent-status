name: update status
on:
  schedule:
    - cron: "10 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the status page
        run: |
          curl -sf -m 30 https://earning-agent.vercel.app/api/status -o status.json
          test -s status.json
      - name: Commit
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status.json
          git commit -m "status $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push
